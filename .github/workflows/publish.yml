name: Publish to npm

on:
  push:
    tags:
      - 'v*'
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version to publish (e.g. 0.1.0). Leave empty to use package.json version.'
        required: false
        type: string
      dist_tag:
        description: 'npm dist-tag (e.g. latest, beta, next)'
        required: false
        default: 'latest'
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, Test & Publish (@universal-agent/*)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Upgrade npm for OIDC Trusted Publishing support (npm >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync package versions
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: pnpm run release:version

      - name: Build and verify packages
        run: |
          pnpm run typecheck
          pnpm run build
          pnpm run test

      - name: Pack & Publish @universal-agent/acp-extension-core and @universal-agent/client via OIDC
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ inputs.dist_tag || 'latest' }}
        run: |
          # If NPM_TOKEN is optionally provided, configure it; otherwise npm >= 11.5.1
          # automatically uses GitHub Actions OIDC Trusted Publishing (id-token: write).
          if [ -n "$NPM_TOKEN" ]; then
            npm config set //registry.npmjs.org/:_authToken "$NPM_TOKEN"
          fi

          for pkg_dir in packages/acp-extension-core packages/agent-client; do
            echo "Packing $pkg_dir (resolving workspace:* protocol)..."
            tarball=$(cd "$pkg_dir" && pnpm pack | tail -n 1)
            echo "Publishing $pkg_dir/$tarball to npm..."
            npm publish "$pkg_dir/$tarball" --access public --provenance --tag "$NPM_DIST_TAG"
          done
